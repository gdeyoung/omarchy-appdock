<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AppDock — synthetic mockups</title>
<style>
  /* AppDock mockups — Omarchy dark shell theme, accent violet.
     All window titles and app identities are synthetic. */
  :root {
    --bg: #0b0d12;
    --panel: #10131a;
    --panel2: #161a24;
    --border: rgba(255,255,255,.09);
    --ink: #e6e9f0;
    --muted: #8b93a7;
    --dim: #5c6478;
    --accent: #bb9af7;
    --green: #9ece6a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    font-family: 'JetBrains Mono', 'JetBrainsMono Nerd Font', ui-monospace, monospace;
    color: var(--ink);
    padding: 28px;
    display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap;
  }
  .caption { width: 100%; text-align: left; color: var(--dim); font-size: 11px; padding: 4px 2px; }

  /* ---- desktop vignette ---- */
  .desktop {
    width: 640px; height: 400px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border); box-shadow: 0 24px 60px rgba(0,0,0,.5);
    background:
      radial-gradient(520px 300px at 70% 80%, rgba(187,154,247,.13), transparent 65%),
      radial-gradient(420px 260px at 15% 20%, rgba(122,162,247,.08), transparent 60%),
      linear-gradient(160deg, #0e1118 0%, #0b0d12 100%);
    position: relative;
  }
  .bar {
    position: absolute; top: 0; left: 0; right: 0; height: 44px;
    background: rgba(16,19,26,.92); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 14px;
  }
  .ws { font-size: 12px; color: var(--dim); display: flex; gap: 10px; }
  .ws b { color: var(--ink); font-weight: 600; }
  .sep { width: 1px; height: 18px; background: var(--border); }
  .dock { display: flex; align-items: center; gap: 8px; }
  .appicon {
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; position: relative;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
  }
  .appicon.focused { color: var(--ink); border-color: rgba(187,154,247,.55); box-shadow: 0 0 0 1px rgba(187,154,247,.25); }
  .appicon.minimized { opacity: .45; }
  .appicon.minimized::after {
    content: ""; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent); opacity: 1;
  }
  .spacer { flex: 1; }
  .tray { font-size: 11px; color: var(--dim); }

  /* floating window with titlebar buttons */
  .fwin {
    position: absolute; left: 70px; top: 92px; width: 420px; height: 240px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 30px 70px rgba(0,0,0,.55); overflow: hidden;
  }
  .tbar {
    height: 34px; display: flex; align-items: center; padding: 0 6px 0 14px;
    background: var(--panel2); border-bottom: 1px solid var(--border); gap: 10px;
  }
  .tbar .title { font-size: 11.5px; color: var(--muted); flex: 1; }
  .tbtn {
    width: 26px; height: 22px; border-radius: 6px; display: flex; align-items: center;
    justify-content: center; font-size: 11px; color: var(--dim);
  }
  .tbtn.min:hover, .tbtn.max { color: var(--muted); }
  .tbtn.close { color: #f7768e; background: rgba(247,118,142,.10); }
  .fwin .content { padding: 16px 18px; }
  .fwin .line { height: 9px; border-radius: 5px; background: rgba(255,255,255,.07); margin-bottom: 10px; }
  .fwin .line.w1 { width: 62%; } .fwin .line.w2 { width: 88%; }
  .fwin .line.w3 { width: 74%; } .fwin .line.w4 { width: 46%; background: rgba(187,154,247,.18); }

  /* ---- dock zoom strip ---- */
  .zoom {
    width: 560px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px 22px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    display: flex; align-items: flex-start; justify-content: center; gap: 18px;
  }
  .zicon {
    width: 52px; display: flex; flex-direction: column; align-items: center; gap: 9px;
  }
  .zicon .box {
    width: 46px; height: 46px; border-radius: 12px; position: relative;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
  }
  .zicon.focused .box { color: var(--ink); border-color: rgba(187,154,247,.55); box-shadow: 0 0 0 1px rgba(187,154,247,.25); }
  .zicon.minimized .box { opacity: .45; }
  .zicon.minimized .box::after {
    content: ""; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }
  .zicon .lbl { font-size: 9.5px; color: var(--dim); }

  /* ---- hover tooltip ---- */
  .hovercard {
    width: 460px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 22px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; gap: 26px;
  }
  .tip {
    background: var(--panel2); border: 1px solid rgba(187,154,247,.35);
    border-radius: 9px; padding: 9px 14px; font-size: 12.5px; color: var(--ink);
    box-shadow: 0 12px 34px rgba(0,0,0,.5); white-space: nowrap;
  }
  .tip .arr { color: var(--dim); }
</style>
</head>
<body>

<!-- ============ SCENE 1: DESKTOP VIGNETTE ============ -->
<div>
<div class="caption">1 · The dock in the bar (focused · minimized · normal)</div>
<div class="desktop" id="panel-desktop">
  <div class="bar">
    <div class="ws"><b>1</b><span>2</span><span>3</span></div>
    <div class="sep"></div>
    <div class="dock">
      <div class="appicon focused"></div>
      <div class="appicon minimized"></div>
      <div class="appicon"></div>
      <div class="appicon"></div>
      <div class="appicon minimized"></div>
    </div>
    <div class="spacer"></div>
    <div class="tray">21:47</div>
  </div>
  <div class="fwin">
    <div class="tbar">
      <span class="title">journal.md — Notes</span>
      <div class="tbtn min"></div>
      <div class="tbtn max"></div>
      <div class="tbtn close"></div>
    </div>
    <div class="content">
      <div class="line w1"></div><div class="line w2"></div><div class="line w3"></div><div class="line w4"></div>
    </div>
  </div>
</div>
</div>

<!-- ============ SCENE 2: DOCK ZOOM ============ -->
<div>
<div class="caption">2 · Dock states zoomed</div>
<div class="zoom" id="panel-dockzoom">
  <div class="zicon focused"><div class="box"></div><span class="lbl">focused</span></div>
  <div class="zicon minimized"><div class="box"></div><span class="lbl">minimized</span></div>
  <div class="zicon"><div class="box"></div><span class="lbl">running</span></div>
  <div class="zicon"><div class="box"></div><span class="lbl">running</span></div>
  <div class="zicon minimized"><div class="box"></div><span class="lbl">minimized</span></div>
</div>
</div>

<!-- ============ SCENE 3: HOVER TOOLTIP ============ -->
<div>
<div class="caption">3 · Hover for app + title</div>
<div class="hovercard" id="panel-hover">
  <div class="appicon minimized" style="width:40px;height:40px;font-size:21px;"></div>
  <div class="tip">Files <span class="arr">—</span> Downloads <span class="arr">· click to restore</span></div>
</div>
</div>

<script>
  // Export mode
  const params = new URLSearchParams(location.search);
  const only = params.get('only');
  if (only) {
    document.body.style.padding = '0';
    document.querySelectorAll('.caption').forEach(e => e.remove());
    document.querySelectorAll('body > div').forEach(w => {
      if (!w.querySelector('#' + only)) w.remove();
    });
    document.body.style.display = 'block';
  }
  // Nerd Font glyphs for generic app identities (browser, files, terminal,
  // editor, music) + titlebar buttons (minimize, maximize, close).
  const APP = ["\uF268", "\uF07B", "\uF120", "\uF121", "\uF001"]; // firefox-ish window, folder, terminal, code, music
  document.querySelectorAll('.dock .appicon').forEach((el, i) => el.textContent = APP[i % APP.length]);
  document.querySelectorAll('.zoom .box').forEach((el, i) => el.textContent = APP[i % APP.length]);
  document.querySelector('.hovercard .appicon').textContent = APP[1];
  const TB = { min: "\uF068", max: "\uF065", close: "\uF00D" }; // −, expand, ×
  document.querySelector('.tbtn.min').textContent = TB.min;
  document.querySelector('.tbtn.max').textContent = TB.max;
  document.querySelector('.tbtn.close').textContent = TB.close;
</script>
</body>
</html>
